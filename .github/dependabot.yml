version: 2

# Groups default to version updates only. The security groups below carry an
# explicit applies-to so Dependabot consolidates security advisories too,
# instead of opening one pull request per advisory.
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      security-production:
        applies-to: security-updates
        dependency-type: "production"
        patterns:
          - "*"
      security-development:
        applies-to: security-updates
        dependency-type: "development"
        patterns:
          - "*"
      version-production:
        applies-to: version-updates
        dependency-type: "production"
        patterns:
          - "*"
      version-development:
        applies-to: version-updates
        dependency-type: "development"
        patterns:
          - "*"
