# Containerized CPL game vhost (baked into cpl-web at /etc/nginx/conf.d/default.conf).
# Derived from the prod /etc/nginx/sites-enabled/clubpenguinlive, with three changes for compose:
#   - upstreams are service names (cpl-login / cpl-blizzard / cpl-php) not localhost
#   - php-fpm is TCP (cpl-php:9000), not the unix socket
#   - the distro snippet `snippets/fastcgi-php.conf` is inlined (not present in the nginx image)
# Cloudflare terminates TLS at the edge; the tunnel carries plain HTTP to this server on :8080.

resolver 127.0.0.11 valid=10s ipv6=off;   # Docker embedded DNS; re-resolve upstreams every 10s so nginx picks up container restarts without a reload

limit_req_zone $binary_remote_addr zone=cpl_login:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=cpl_register:10m rate=10r/m;

server {
    listen 8080;
    server_name play.clubpenguinlive.net clubpenguinlive.net;

    set_real_ip_from 0.0.0.0/0;            # cloudflared is the only upstream; trust CF-Connecting-IP
    real_ip_header CF-Connecting-IP;

    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://cdn.jsdelivr.net https://challenges.cloudflare.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self'; font-src 'self' data:; connect-src 'self' blob: wss://clubpenguinlive.net wss://play.clubpenguinlive.net https://challenges.cloudflare.com https://cdn.jsdelivr.net https://cloudflareinsights.com; frame-src 'self' https://challenges.cloudflare.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Cache-Control "no-cache" always;

    # Account-creation / account-management PHP (php-fpm over TCP to the cpl-php service)
    location ~ ^/(create|account)/.*\.php$ {
        limit_req zone=cpl_register burst=5 nodelay;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass cpl-php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Pizzatron locale: the game requests undefined.swf; serve locale.swf in its place.
    location = /assets/media/flash/games/lang/en/undefined.swf {
        alias /usr/share/nginx/html/assets/media/flash/games/lang/en/locale.swf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # crumbs.json has a stable URL and mutable content; carve it out of the immutable rule above.
    location ~ ^/assets/media/crumbs/.*\.json$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location /minigames/ {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'" always;
        try_files $uri $uri/ =404;
    }

    location = /stats {
        try_files /pages/stats.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /api/stats/blizzard {
        set $upstream http://cpl-blizzard:6112;
        proxy_pass $upstream/players;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin "https://clubpenguinlive.net";
    }

    location = /api/stats/iceberg {
        set $upstream http://cpl-blizzard2:6113;
        proxy_pass $upstream/players;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin "https://clubpenguinlive.net";
    }

    location /world/login {
        limit_req zone=cpl_login burst=10 nodelay;
        set $upstream_login cpl-login;
        proxy_pass http://$upstream_login:6111;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    location /world/blizzard {
        set $upstream_blizzard cpl-blizzard;
        proxy_pass http://$upstream_blizzard:6112;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    location /world/iceberg {
        set $upstream_iceberg cpl-blizzard2;
        proxy_pass http://$upstream_iceberg:6113;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }
}
